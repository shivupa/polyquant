name: Polyquant Docs Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  cmake-build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
            name: "Ubuntu_Latest_GCC11_Debug_Ninja_Docs",
            os: ubuntu-latest,
            build_type: "Debug",
            pkgs: "gcc-11 g++-11",
            cc: "gcc-11",
            cxx: "g++-11",
            generators: "Ninja"
          }
    steps:
      - name: checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Print env
        run: |
          echo github.event.action: ${{ github.event.action }}
          echo github.event_name: ${{ github.event_name }}
      - name: Download artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: libint.yml
          workflow_conclusion: success
          name: polyquant-libint.deb
      - name: Install dependencies on Ubuntu
        if: startsWith(matrix.config.name, 'Ubuntu_Latest')
        run: |
          sudo apt-get update
          sudo apt-get install \
            ninja-build \
            cmake \
            libboost-all-dev \
            intel-mkl \
            liblapack-dev \
            libeigen3-dev \
            libhdf5-dev \
            lcov \
            doxygen \
            latexmk \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            ${{ matrix.config.pkgs }}
          python -m pip install -r docs/requirements.txt
          ninja --version
          cmake --version
          ${{ matrix.config.cc }} --version
          sudo dpkg -i polyquant-libint.deb
          mkdir builddir
          echo $MKLROOT
          ls /usr/share/libint/*/basis/
      - name: Install libmsym
        run: |
          git clone https://github.com/mcodev31/libmsym.git
          cd libmsym
          git checkout 85e47232376a8e735c2a7b5283f40b59b3953db1
          mkdir build
          cd build
          # build as shared library; build examples (built in ./examples,  not installed)
          cmake -DBUILD_SHARED_LIBS:BOOL=ON -DMSYM_BUILD_EXAMPLES:BOOL=ON ../.
          make
          sudo make install
      - name: Create a directory that the libint imported target requires. DO NOT DELETE THIS STEP.
        shell: bash
        run: |
          mkdir $GITHUB_WORKSPACE/libint2
      - name: Configure
        shell: bash
        working-directory: builddir
        env:
          CC: matrix.config.cc
          CXX: matrix.config.cxx
          MKLROOT: /usr/include/mkl
        run: |
          cmake \
            -DPOLYQUANT_DOC=1 \
            -DPOLYQUANT_TEST=1 \
            -DPOLYQUANT_CODE_COVERAGE=0 \
            -DCMAKE_C_COMPILER=${{ matrix.config.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
            -G "${{ matrix.config.generators }}" \
            ..
      - name: Build
        shell: bash
        working-directory: builddir
        run: cmake --build . --config ${{ matrix.config.build_type }}
      - name: Build docs HTML
        shell: bash
        working-directory: builddir
        run: cmake --build . --target polyquant_docs_html --config ${{ matrix.config.build_type }}
      - name: Build docs PDF
        shell: bash
        working-directory: builddir
        run: cmake --build . --target polyquant_docs_pdf --config ${{ matrix.config.build_type }}
      - name: Publish PDF with docs site
        shell: bash
        working-directory: builddir
        run: cp docs/latex/polyquant.pdf docs/html/polyquant.pdf
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: 'builddir/docs/html'
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
      
